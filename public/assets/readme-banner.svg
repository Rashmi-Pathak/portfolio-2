<svg viewBox="0 0 1200 320" width="1200" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#11100F" opacity="0.14" />
    </pattern>
    <clipPath id="brushReveal">
      <rect x="0" y="0" width="1200" height="320">
        <animate attributeName="width" from="0" to="1200" dur="1.4s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <!-- Warm Ivory Paper -->
  <rect width="1200" height="320" fill="#EFE8D8" />
  <rect x="650" y="0" width="550" height="320" fill="url(#dots)" />

  <!-- Outer Editorial Border -->
  <rect x="14" y="14" width="1172" height="292" fill="none" stroke="#11100F" stroke-width="2" />

  <!-- Top Meta Strip -->
  <rect x="40" y="38" width="10" height="10" fill="#B51F2B" />
  <text x="62" y="48" font-family="monospace" font-size="12" letter-spacing="3" fill="#11100F">
    CHAPTER 01 — SOFTWARE ENGINEER · AI / ML · FINTECH · MUMBAI, INDIA
  </text>

  <!-- Animated Crimson Brushstroke -->
  <g clip-path="url(#brushReveal)">
    <path d="M 32 184 Q 340 164 620 178 T 1168 158 L 1168 196 Q 820 210 520 198 T 32 214 Z" fill="#B51F2B" opacity="0.92" />
  </g>

  <!-- Oversized Condensed Wordmark -->
  <text x="40" y="156" font-family="Impact, Arial Black, sans-serif" font-size="108" font-weight="900" letter-spacing="-2" fill="#11100F">
    RASHMI
  </text>
  <text x="120" y="246" font-family="Impact, Arial Black, sans-serif" font-size="104" font-weight="900" letter-spacing="-2" fill="none" stroke="#11100F" stroke-width="3">
    PATHAK
  </text>

  <!-- Bottom Right Seal -->
  <rect x="1030" y="232" width="128" height="44" fill="#11100F" />
  <text x="1094" y="259" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="2" fill="#F0E4C9">
    16 VOLUMES
  </text>
</svg>
